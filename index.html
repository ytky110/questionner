<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionner</title>
  <link rel="stylesheet" href="style.css">
  <script src="src.js" defer></script>
</head>
<body>
  <header>
    <h1>Questionner</h1>
  </header>

  <main>
    <section id="load">
      <h2>設定</h2>

      <div class="field">
        <label for="file">問題集：</label>
        <input id="file" type="file">
      </div>

      <div class="field">
        <label for="exnumber">出題数：</label>
        <input id="exnumber" type="number">
        <small>全 <output id="qnumber"></output> 問</small>
      </div>

      <button id="start">始める</button>
    </section>

    <section id="ex">
      <div class="question-header">
        <div class="field">
          <label for="instructions">指示</label>
          <output id="instructions"></output>
        </div>

        <div class="field">
          <label for="question">問題</label>
          <output id="question"></output>
        </div>
      </div>

      <div id="input_div">
        <label for="input">入力</label>
        <input id="input" type="text" autocomplete="off">
      </div>

      <div id="choice"></div>

      <button id="check">確認</button>

      <div id="response_div">
        <label for="response">答え</label>
        <output id="response"></output>
      </div>

      <div id="self_buttons">
        <button id="ok">正解</button>
        <button id="bad">不正解</button>
      </div>

      <div id="judge">
        <output id="message"></output>
        <button id="next">次</button>
      </div>
    </section>

    <section id="result">
      <h2>結果</h2>
      <div class="field">
        <label for="points">点数</label>
        <output id="points"></output>
      </div>
      <p>やり直す、別の問題集をやるにはリロードしてください。</p>
    </section>

    <section id="error">
      <h2>エラー</h2>
      <output id="errmsg"></output>
    </section>
  </main>

  <footer>
    <hr>
    <p><a href="https://ytky110.github.io/">Home</a></p>
    <p>Yutaka Goy — &lt;me@yutaka.ch&gt;</p>
  </footer>
</body>
</html>
